  <!-- Application Logic -->
  <script>
    // ==========================================
    // 1. Italian Tempo Markings Dictionary
    // ==========================================
    const TEMPO_MARKINGS = [
      { max: 44, term: "Grave (きわめて重々しく)" },
      { max: 59, term: "Largo (幅広く緩やかに)" },
      { max: 66, term: "Larghetto (Largoよりやや速く)" },
      { max: 76, term: "Adagio (ゆるやかに)" },
      { max: 108, term: "Andante (歩くような速さで)" },
      { max: 120, term: "Moderato (中庸な速さで)" },
      { max: 156, term: "Allegro (快活に速く)" },
      { max: 176, term: "Vivace (活発に速く)" },
      { max: 200, term: "Presto (きわめて速く)" },
      { max: 999, term: "Prestissimo (最も速く)" }
    ];

    function getTempoMarking(bpm) {
      for (const item of TEMPO_MARKINGS) {
        if (bpm <= item.max) return item.term;
      }
      return "Prestissimo";
    }

    // ==========================================
    // 2. High-Accuracy Web Audio Scheduling Engine
    // (Chris Wilson lookahead scheduler pattern)
    // ==========================================
    let audioCtx = null;
    let masterGain = null;
    let isPlaying = false;

    let bpm = 120;
    let timeSignature = 4; // Beats per measure (1, 2, 3, 4, 5, 6)
    let subdivision = 1;   // 1=quarter, 2=eighth, 3=triplet, 4=sixteenth
    let soundTone = 'woodblock'; // 'woodblock', 'mechanical', 'digital'
    let volume = 0.8;

    // Scheduling state
    let currentSubBeat = 0;   // Current position within measure subdivisions
    let nextNoteTime = 0.0;   // When the next sub-beat is due
    const lookahead = 25.0;   // Scheduler frequency in ms
    const scheduleAheadTime = 0.1; // Schedule notes ahead by 100ms
    let timerID = null;

    // Visual synchronization queue
    const noteQueue = []; // Holds notes scheduled ahead: { beat, isSubdivision, time }

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(volume, audioCtx.currentTime);
        masterGain.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function nextNote() {
      // Seconds per beat divided by subdivision count
      const secondsPerBeat = 60.0 / bpm;
      const secondsPerSubBeat = secondsPerBeat / subdivision;
      nextNoteTime += secondsPerSubBeat;

      currentSubBeat++;
      const totalSubBeatsInMeasure = timeSignature * subdivision;
      if (currentSubBeat >= totalSubBeatsInMeasure) {
        currentSubBeat = 0;
      }
    }

    // Synthesize the click tones programmatically (no external files)
    function playClick(time, beatNumber, isSub) {
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(masterGain);

      const isAccent = (beatNumber === 0 && !isSub);

      if (soundTone === 'woodblock') {
        // Organic Woodblock resonant impulse
        if (isAccent) {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(1400, time);
          osc.frequency.exponentialRampToValueAtTime(700, time + 0.04);
          gain.gain.setValueAtTime(1.0, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.045);
        } else if (isSub) {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(750, time);
          osc.frequency.exponentialRampToValueAtTime(400, time + 0.02);
          gain.gain.setValueAtTime(0.35, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.025);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(950, time);
          osc.frequency.exponentialRampToValueAtTime(500, time + 0.035);
          gain.gain.setValueAtTime(0.7, time);
          gain.gain.exponentialRampToValueAtTime(0.001, time + 0.038);
        }
        osc.start(time);
        osc.stop(time + 0.05);

      } else if (soundTone === 'digital') {
        // High piercing electronic beep
        osc.type = 'sine';
        if (isAccent) {
          osc.frequency.setValueAtTime(1760, time); // A6
          gain.gain.setValueAtTime(0.8, time);
        } else if (isSub) {
          osc.frequency.setValueAtTime(880, time);  // A5
          gain.gain.setValueAtTime(0.25, time);
        } else {
          osc.frequency.setValueAtTime(1174, time); // D6
          gain.gain.setValueAtTime(0.55, time);
        }
        gain.gain.exponentialRampToValueAtTime(0.001, time + (isAccent ? 0.04 : 0.025));
        osc.start(time);
        osc.stop(time + 0.05);

      } else if (soundTone === 'mechanical') {
        // Sharp metallic / mechanical tick
        osc.type = 'triangle';
        const startFreq = isAccent ? 2400 : (isSub ? 1200 : 1800);
        osc.frequency.setValueAtTime(startFreq, time);
        osc.frequency.exponentialRampToValueAtTime(120, time + 0.02);
        gain.gain.setValueAtTime(isAccent ? 0.9 : (isSub ? 0.3 : 0.6), time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.022);
        osc.start(time);
        osc.stop(time + 0.03);
      }
    }

    function schedule() {
      // Loop scheduling while notes are due within scheduleAheadTime
      while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
        const beatNumber = Math.floor(currentSubBeat / subdivision);
        const isSub = (currentSubBeat % subdivision !== 0);

        playClick(nextNoteTime, beatNumber, isSub);
        noteQueue.push({ beat: beatNumber, isSub: isSub, time: nextNoteTime });

        nextNote();
      }
      timerID = setTimeout(schedule, lookahead);
    }

    // ==========================================
    // 3. Visual Sync & Pendulum Physics
    // ==========================================
    let pendulumStartTime = 0;
    let animFrameId = null;

    function startVisualLoop() {
      pendulumStartTime = performance.now();
      requestAnimationFrame(renderVisuals);
    }

    function renderVisuals(now) {
      if (!isPlaying) return;

      // 1. Process audio noteQueue to flash LED dots precisely when audio sounds
      const currentTime = audioCtx ? audioCtx.currentTime : 0;
      while (noteQueue.length && noteQueue[0].time <= currentTime) {
        const currentNote = noteQueue.shift();
        if (!currentNote.isSub) {
          highlightBeatDot(currentNote.beat);
        }
      }

      // 2. Pendulum sine wave smooth swinging
      // One full period (left-to-right-to-left) = 2 beats
      const secondsPerBeat = 60.0 / bpm;
      const elapsedSeconds = (now - pendulumStartTime) / 1000.0;
      
      // Calculate angle: oscillates between -28 deg and +28 deg
      const maxAngle = 26;
      // Frequency in radians per second: omega = PI / secondsPerBeat (so half period = 1 beat)
      const omega = Math.PI / secondsPerBeat;
      const angle = Math.sin(elapsedSeconds * omega) * maxAngle;

      const pendulumArm = document.getElementById('pendulumArm');
      if (pendulumArm) {
        pendulumArm.style.transform = `rotate(${angle.toFixed(2)}deg)`;
      }

      animFrameId = requestAnimationFrame(renderVisuals);
    }

    function resetPendulum() {
      const pendulumArm = document.getElementById('pendulumArm');
      if (pendulumArm) {
        pendulumArm.style.transform = 'rotate(0deg)';
      }
      clearBeatHighlights();
    }

    // Position of sliding bob on arm based on BPM
    // Slower BPM (30) = Bob near top (higher gravity pendulum)
    // Faster BPM (280) = Bob near bottom pivot
    function updatePendulumBobPosition() {
      const bob = document.getElementById('pendulumBob');
      if (!bob) return;
      const minBpm = 30;
      const maxBpm = 280;
      const clamped = Math.min(Math.max(bpm, minBpm), maxBpm);
      
      // Normalize: 0 = slowest (top: ~15px), 1 = fastest (bottom: ~115px)
      const ratio = (clamped - minBpm) / (maxBpm - minBpm);
      const topPx = 18 + (ratio * 96);
      bob.style.top = `${topPx}px`;
    }

    // ==========================================
    // 4. UI Controls: Beat Dots, BPM, Play/Stop
    // ==========================================
    function setupBeatDots() {
      const container = document.getElementById('beatDotsContainer');
      container.innerHTML = '';
      for (let i = 0; i < timeSignature; i++) {
        const dot = document.createElement('div');
        dot.id = `beat-dot-${i}`;
        dot.className = `w-4 h-4 rounded-full border transition-all duration-75 flex items-center justify-center text-[9px] font-bold ${
          i === 0 
            ? 'border-amber-500/70 bg-amber-950/40 text-amber-300' 
            : 'border-slate-700 bg-slate-800 text-slate-400'
        }`;
        dot.innerText = i + 1;
        container.appendChild(dot);
      }
    }

    function highlightBeatDot(beatIndex) {
      for (let i = 0; i < timeSignature; i++) {
        const dot = document.getElementById(`beat-dot-${i}`);
        if (!dot) continue;
        if (i === beatIndex) {
          if (i === 0) {
            dot.className = 'w-4 h-4 rounded-full border border-amber-300 bg-amber-400 text-slate-950 scale-125 beat-glow-primary transition-all duration-75 font-bold flex items-center justify-center text-[9px]';
          } else {
            dot.className = 'w-4 h-4 rounded-full border border-indigo-400 bg-indigo-500 text-white scale-110 beat-glow-sub transition-all duration-75 font-bold flex items-center justify-center text-[9px]';
          }
        } else {
          dot.className = `w-4 h-4 rounded-full border transition-all duration-150 flex items-center justify-center text-[9px] font-bold ${
            i === 0 
              ? 'border-amber-500/70 bg-amber-950/40 text-amber-300' 
              : 'border-slate-700 bg-slate-800 text-slate-400'
          }`;
        }
      }
    }

    function clearBeatHighlights() {
      for (let i = 0; i < timeSignature; i++) {
        const dot = document.getElementById(`beat-dot-${i}`);
        if (dot) {
          dot.className = `w-4 h-4 rounded-full border transition-all duration-150 flex items-center justify-center text-[9px] font-bold ${
            i === 0 
              ? 'border-amber-500/70 bg-amber-950/40 text-amber-300' 
              : 'border-slate-700 bg-slate-800 text-slate-400'
          }`;
        }
      }
    }

    function setBpm(val) {
      bpm = parseInt(val, 10);
      if (bpm < 30) bpm = 30;
      if (bpm > 280) bpm = 280;

      document.getElementById('bpmDisplay').innerText = bpm;
      document.getElementById('bpmSlider').value = bpm;
      document.getElementById('tempoTerm').innerText = getTempoMarking(bpm);
      updatePendulumBobPosition();
    }

    function adjustBpm(delta) {
      setBpm(bpm + delta);
    }

    function setTimeSignature(ts) {
      timeSignature = parseInt(ts, 10);
      document.querySelectorAll('#tsBtnGroup .ts-btn').forEach(btn => {
        const bTs = parseInt(btn.getAttribute('data-ts'), 10);
        if (bTs === timeSignature) {
          btn.className = 'ts-btn py-1.5 rounded-xl text-xs font-bold font-mono bg-indigo-600 text-white border border-indigo-500 shadow-sm transition';
        } else {
          btn.className = 'ts-btn py-1.5 rounded-xl text-xs font-bold font-mono bg-slate-800 text-slate-300 border border-slate-700/80 hover:bg-slate-700 transition';
        }
      });
      setupBeatDots();
      currentSubBeat = 0;
    }

    function setSubdivision(sub) {
      subdivision = parseInt(sub, 10);
      document.querySelectorAll('#subdivBtnGroup .subdiv-btn').forEach(btn => {
        const bSub = parseInt(btn.getAttribute('data-sub'), 10);
        if (bSub === subdivision) {
          btn.className = 'subdiv-btn py-2 px-2 rounded-xl text-xs font-semibold bg-indigo-600 text-white border border-indigo-500 shadow-sm transition text-left flex items-center justify-between';
        } else {
          btn.className = 'subdiv-btn py-2 px-2 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700/80 hover:bg-slate-700 transition text-left flex items-center justify-between';
        }
      });
      currentSubBeat = 0;
    }

    function setSoundTone(tone) {
      soundTone = tone;
      document.querySelectorAll('#toneBtnGroup .tone-btn').forEach(btn => {
        const bTone = btn.getAttribute('data-tone');
        const iconCheck = btn.querySelector('.fa-check');
        if (bTone === tone) {
          btn.className = 'tone-btn w-full py-2 px-3 rounded-xl text-xs font-semibold bg-indigo-600 text-white border border-indigo-500 shadow-sm transition flex items-center justify-between';
          if (iconCheck) iconCheck.classList.remove('opacity-0');
        } else {
          btn.className = 'tone-btn w-full py-2 px-3 rounded-xl text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700/80 hover:bg-slate-700 transition flex items-center justify-between';
          if (iconCheck) iconCheck.classList.add('opacity-0');
        }
      });
    }

    function setVolume(val) {
      volume = parseFloat(val);
      if (masterGain && audioCtx) {
        masterGain.gain.setValueAtTime(volume, audioCtx.currentTime);
      }
      document.getElementById('volumeLabel').innerText = Math.round(volume * 100) + '%';
    }

    function togglePlay() {
      initAudio();
      if (isPlaying) {
        stopMetronome();
      } else {
        startMetronome();
      }
    }

    function startMetronome() {
      initAudio();
      isPlaying = true;
      currentSubBeat = 0;
      nextNoteTime = audioCtx.currentTime + 0.05;

      schedule();
      startVisualLoop();

      document.getElementById('playIcon').className = 'fa-solid fa-pause text-xl';
      document.getElementById('playText').innerText = 'ストップ (Space)';
      document.getElementById('playBtn').classList.replace('bg-indigo-600', 'bg-amber-500');
      document.getElementById('playBtn').classList.replace('hover:bg-indigo-500', 'hover:bg-amber-400');
    }

    function stopMetronome() {
      isPlaying = false;
      if (timerID) clearTimeout(timerID);
      if (animFrameId) cancelAnimationFrame(animFrameId);
      noteQueue.length = 0;

      resetPendulum();

      document.getElementById('playIcon').className = 'fa-solid fa-play text-xl';
      document.getElementById('playText').innerText = 'スタート (Space)';
      document.getElementById('playBtn').classList.replace('bg-amber-500', 'bg-indigo-600');
      document.getElementById('playBtn').classList.replace('hover:bg-amber-400', 'hover:bg-indigo-500');
    }

    // ==========================================
    // 5. Tap Tempo Feature
    // ==========================================
    const tapTimes = [];
    let tapResetTimer = null;

    function handleTapTempo() {
      const now = performance.now();
      tapTimes.push(now);

      if (tapResetTimer) clearTimeout(tapResetTimer);
      tapResetTimer = setTimeout(() => {
        tapTimes.length = 0;
      }, 2500); // Reset if inactive for 2.5s

      if (tapTimes.length > 1) {
        // Keep only last 5 taps
        if (tapTimes.length > 5) tapTimes.shift();

        // Calculate average interval
        let intervals = [];
        for (let i = 1; i < tapTimes.length; i++) {
          intervals.push(tapTimes[i] - tapTimes[i - 1]);
        }
        const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
        const calculatedBpm = Math.round(60000 / avgInterval);

        if (calculatedBpm >= 30 && calculatedBpm <= 280) {
          setBpm(calculatedBpm);
        }
      }
    }

    // ==========================================
    // 6. Practice Countdown Timer
    // ==========================================
    let practiceInterval = null;
    let practiceSecondsLeft = 0;

    function startPracticeTimer(minutes) {
      if (practiceInterval) clearInterval(practiceInterval);
      practiceSecondsLeft = minutes * 60;
      updatePracticeTimerDisplay();
      document.getElementById('practiceTimerBanner').classList.remove('hidden');

      if (!isPlaying) startMetronome();

      practiceInterval = setInterval(() => {
        if (practiceSecondsLeft > 0) {
          practiceSecondsLeft--;
          updatePracticeTimerDisplay();
        } else {
          cancelPracticeTimer();
          stopMetronome();
          playPracticeEndChime();
        }
      }, 1000);
    }

    function updatePracticeTimerDisplay() {
      const m = Math.floor(practiceSecondsLeft / 60).toString().padStart(2, '0');
      const s = (practiceSecondsLeft % 60).toString().padStart(2, '0');
      document.getElementById('practiceTimeLeft').innerText = `${m}:${s}`;
    }

    function cancelPracticeTimer() {
      if (practiceInterval) {
        clearInterval(practiceInterval);
        practiceInterval = null;
      }
      document.getElementById('practiceTimerBanner').classList.add('hidden');
    }

    function playPracticeEndChime() {
      initAudio();
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const t = audioCtx.currentTime + (idx * 0.22);
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 1.9);
      });
    }

    // ==========================================
    // 7. Keyboard Shortcuts
    // ==========================================
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowUp') {
        e.preventDefault();
        adjustBpm(1);
      } else if (e.code === 'ArrowDown') {
        e.preventDefault();
        adjustBpm(-1);
      } else if (e.key.toLowerCase() === 't') {
        handleTapTempo();
      }
    });

    // Initialize on load
    window.addEventListener('DOMContentLoaded', () => {
      setupBeatDots();
      setBpm(120);
      updatePendulumBobPosition();
    });
  </script>
</body>
</html>
