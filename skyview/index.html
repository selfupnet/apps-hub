    <div id="root"></div>
<script>
window.addEventListener('DOMContentLoaded', () => {
  // 1. ヘッダー左端に「← Apps Hub」戻りリンクを追加
  const headerInner = document.querySelector('header > div');
  if (headerInner && !headerInner.querySelector('a[href="../"]')) {
    const backLink = document.createElement('a');
    backLink.href = '../';
    backLink.textContent = '← Apps Hub';
    backLink.className = 'inline-flex items-center gap-1 rounded-lg border border-[#25334C] bg-[#11192A] px-2.5 py-1.5 text-xs font-semibold text-slate-300 hover:border-amber-400/70 hover:text-amber-200 transition-colors whitespace-nowrap shrink-0';
    headerInner.insertBefore(backLink, headerInner.firstChild);
  }
  // 2. 画面最下部に統一免責フッター（コピーライトなし）を追加
  const rootDiv = document.querySelector('#root > div');
  if (rootDiv && !rootDiv.querySelector('footer')) {
    const footer = document.createElement('footer');
    footer.className = 'mt-8 py-6 text-center border-t border-[#1A2438]';
    footer.innerHTML = '<div class="max-w-4xl mx-auto px-4"><p class="text-[11px] text-slate-500">※個人開発プロトタイプにつき無保証・自己責任にてご利用ください（データは端末内完結・サポート対象外）</p></div>';
    rootDiv.appendChild(footer);
  }
});
</script>
