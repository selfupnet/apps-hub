<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-[100dvh] flex flex-col font-sans selection:bg-indigo-600 selection:text-white transition-colors duration-200">

  <!-- ========================================== -->
  <!-- ヘッダー (Apps Hub 統一規格準拠)             -->

  <header class="bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 sticky top-0 z-30 shadow-xs">

      <!-- 左端: 統一戻りリンク -->
      <div class="flex items-center">
        <a href="../" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100 transition py-1.5 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700">
          <i class="fa-solid fa-arrow-left text-[10px]"></i>
          <span>Apps Hub</span>
        </a>
      </div>

      <!-- 中央: アプリアイコン + タイトル -->
      <div class="flex items-center gap-2 text-slate-900 dark:text-white font-extrabold text-base sm:text-lg tracking-tight">
        <div class="w-8 h-8 rounded-xl bg-violet-50 dark:bg-violet-950/70 text-violet-600 dark:text-violet-400 border border-violet-200/80 dark:border-violet-800/80 flex items-center justify-center text-sm shadow-2xs">
          <i class="fa-regular fa-calendar-days"></i>
        </div>
        <span>カレンダー</span>
      </div>

      <!-- 右端: 実機能ボタン群（今日ボタン・テーマ切替） -->
      <div class="flex items-center gap-2">
        <button id="todayBtn" class="px-3 py-1.5 text-xs font-bold rounded-xl bg-indigo-50 hover:bg-indigo-100 dark:bg-indigo-950/70 dark:hover:bg-indigo-900/70 text-indigo-600 dark:text-indigo-300 border border-indigo-200/80 dark:border-indigo-800 transition active:scale-95">
          今日
        </button>
        <button id="themeToggleBtn" class="w-8 h-8 flex items-center justify-center text-slate-600 hover:text-slate-900 dark:text-slate-300 dark:hover:text-white rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 transition active:scale-95" title="ダークモード切り替え" aria-label="ダークモード切り替え">
          <i class="fa-solid fa-sun text-xs hidden dark:inline"></i>
          <i class="fa-solid fa-moon text-xs inline dark:hidden"></i>
        </button>

  </header>

  <!-- ========================================== -->
  <!-- メインコンテンツ                            -->
  <!-- ========================================== -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-3 sm:px-4 pt-4 sm:pt-6 flex flex-col gap-4">

    <!-- 操作ツールバー（年月ナビゲーション ＆ 表示切替） -->
    <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-xs px-3.5 py-2.5 sm:px-5 sm:py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2 sm:gap-3">
        <div class="flex items-center bg-slate-100 dark:bg-slate-800 p-1 rounded-xl border border-slate-200 dark:border-slate-700">
          <button id="prevBtn" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition active:scale-95" title="前へ" aria-label="前へ">
            <i class="fa-solid fa-chevron-left text-xs"></i>
          </button>
          <button id="nextBtn" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition active:scale-95" title="次へ" aria-label="次へ">
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
        </div>

        <h1 id="currentDateLabel" class="text-lg sm:text-xl font-extrabold tracking-tight text-slate-900 dark:text-white select-none">
          2026年 11月
        </h1>
      </div>

      <!-- 表示モード切り替え（月 / 週 / 日） -->
      <div class="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold border border-slate-200 dark:border-slate-700">
        <button data-view="month" class="view-btn px-3.5 py-1.5 rounded-lg transition text-slate-600 dark:text-slate-400">月</button>
        <button data-view="week" class="view-btn px-3.5 py-1.5 rounded-lg transition text-slate-600 dark:text-slate-400">週</button>
        <button data-view="day" class="view-btn px-3.5 py-1.5 rounded-lg transition text-slate-600 dark:text-slate-400">日</button>
      </div>
    </div>

    <!-- カレンダー本体カード（外周枠線と格子線を強調し背景からくっきり独立） -->
    <div id="calendarViewContainer" class="flex-1 bg-white dark:bg-slate-900 rounded-2xl border-2 border-slate-300 dark:border-slate-700 shadow-xs overflow-hidden flex flex-col min-h-[540px]">
      <!-- 動的に月/週/日ビューが挿入されます -->
    </div>

    <!-- ========================================== -->
    <!-- 外部データ出典・ライセンス表記カード          -->
    <!-- ========================================== -->
    <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-xs p-4 text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
      <div class="flex items-start gap-2.5">
        <div class="w-6 h-6 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 flex items-center justify-center text-xs shrink-0 mt-0.5">
          <i class="fa-solid fa-database"></i>
        </div>
        <div class="space-y-1">
          <p class="font-bold text-slate-700 dark:text-slate-200">データ出典・祝日判定について</p>
          <p>
            日本の祝日データは、内閣府「国民の祝日」データに準拠したオープンAPI
            <a href="https://holidays-jp.github.io/" target="_blank" rel="noopener noreferrer" class="text-indigo-600 dark:text-indigo-400 underline hover:opacity-80 font-medium">Holidays JP API</a>（MIT License）からの非同期取得およびブラウザ内キャッシュ（<code class="font-mono text-[11px] bg-slate-100 dark:bg-slate-800 px-1 py-0.5 rounded">localStorage</code>）を使用しています。オフライン環境や取得未完了時でも、国民の祝日に関する法律に基づく自動計算ロジック（ハッピーマンデー・春分/秋分・振替休日・国民の休日）により即座に表示されます。
          </p>
        </div>
      </div>
    </section>

  </main>

  <!-- ========================================== -->
  <!-- フッター (Apps Hub 個別アプリ 正式共通規格)   -->
  <!-- ========================================== -->
  <footer class="mt-8 py-6 text-center border-t border-slate-200 dark:border-slate-800">
    <div class="max-w-4xl mx-auto px-4">
      <p class="text-[11px] text-slate-400">
        ※個人開発プロトタイプにつき無保証・自己責任にてご利用ください（データは端末内完結・サポート対象外）
      </p>
    </div>
  </footer>

  <!-- ========================================== -->
  <!-- アプリケーションロジック                     -->
  <!-- ========================================== -->
  <script>
    // --- 祝日ハイブリッド管理 (自動計算 + API同期 + ローカルキャッシュ) ---
    const API_CACHE_KEY_PREFIX = 'smart_cal_holidays_api_';
    const API_BULK_CACHE_KEY = 'smart_cal_holidays_api_bulk_v1';

    function getNthMonday(year, month, n) {
      const firstDay = new Date(year, month - 1, 1);
      const firstDayOfWeek = firstDay.getDay();
      const offset = (firstDayOfWeek <= 1 ? 1 - firstDayOfWeek : 8 - firstDayOfWeek);
      return 1 + offset + (n - 1) * 7;
    }

    function getVernalEquinoxDay(year) {
      if (year < 1980 || year > 2099) return 20;
      return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
    }

    function getAutumnalEquinoxDay(year) {
      if (year < 1980 || year > 2099) return 23;
      return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
    }

    function calculateHolidaysForYear(year) {
      const holidays = {};

      holidays[`${year}-01-01`] = '元日';
      holidays[`${year}-01-${String(getNthMonday(year, 1, 2)).padStart(2, '0')}`] = '成人の日';
      holidays[`${year}-02-11`] = '建国記念の日';
      if (year >= 2020) {
        holidays[`${year}-02-23`] = '天皇誕生日';
      }
      holidays[`${year}-03-${String(getVernalEquinoxDay(year)).padStart(2, '0')}`] = '春分の日';
      holidays[`${year}-04-29`] = '昭和の日';
      holidays[`${year}-05-03`] = '憲法記念日';
      holidays[`${year}-05-04`] = 'みどりの日';
      holidays[`${year}-05-05`] = 'こどもの日';

      holidays[`${year}-07-${String(getNthMonday(year, 7, 3)).padStart(2, '0')}`] = '海の日';
      if (year >= 2016) {
        holidays[`${year}-08-11`] = '山の日';
      }

      const respectElderDay = getNthMonday(year, 9, 3);
      const autumnEquinoxDay = getAutumnalEquinoxDay(year);
      holidays[`${year}-09-${String(respectElderDay).padStart(2, '0')}`] = '敬老の日';
      holidays[`${year}-09-${String(autumnEquinoxDay).padStart(2, '0')}`] = '秋分の日';

      if (autumnEquinoxDay - respectElderDay === 2) {
        holidays[`${year}-09-${String(respectElderDay + 1).padStart(2, '0')}`] = '国民の休日';
      }

      holidays[`${year}-10-${String(getNthMonday(year, 10, 2)).padStart(2, '0')}`] = 'スポーツの日';
      holidays[`${year}-11-03`] = '文化の日';
      holidays[`${year}-11-23`] = '勤労感謝の日';

      // 振替休日判定（祝日が日曜日の場合、翌日以降の最も早い平日を振替休日にする）
      const sortedDates = Object.keys(holidays).sort();
      sortedDates.forEach(dateStr => {
        const d = new Date(dateStr + 'T00:00:00');
        if (d.getDay() === 0) {
          let substitute = new Date(d);
          while (true) {
            substitute.setDate(substitute.getDate() + 1);
            const subStr = formatDateYMD(substitute);
            if (!holidays[subStr]) {
              holidays[subStr] = '振替休日';
              break;
            }
          }
        }
      });

      return holidays;
    }

    const memoryHolidayCache = {};
    let bulkApiData = null;

    // バルクAPIキャッシュ読み込み
    try {
      const savedBulk = localStorage.getItem(API_BULK_CACHE_KEY);
      if (savedBulk) {
        bulkApiData = JSON.parse(savedBulk);
      }
    } catch (e) {}

    function getHolidaysForYear(year) {
      if (memoryHolidayCache[year]) {
        return memoryHolidayCache[year];
      }

      const calculated = calculateHolidaysForYear(year);
      let merged = { ...calculated };

      // 1. バルクAPIキャッシュがあれば該当年のデータを統合
      if (bulkApiData && typeof bulkApiData === 'object') {
        const yearPrefix = `${year}-`;
        Object.keys(bulkApiData).forEach(dateKey => {
          if (dateKey.startsWith(yearPrefix)) {
            merged[dateKey] = bulkApiData[dateKey];
          }
        });
      }

      // 2. 年別APIキャッシュがあれば統合
      try {
        const cached = localStorage.getItem(API_CACHE_KEY_PREFIX + year);
        if (cached) {
          const parsed = JSON.parse(cached);
          if (parsed && typeof parsed === 'object') {
            merged = { ...merged, ...parsed };
          }
        }
      } catch (e) {}

      memoryHolidayCache[year] = merged;
      fetchBulkHolidaysFromAPI();
      return memoryHolidayCache[year];
    }

    let isFetchingBulk = false;
    let hasFetchedBulkThisSession = false;

    async function fetchBulkHolidaysFromAPI() {
      if (isFetchingBulk || hasFetchedBulkThisSession) return;
      isFetchingBulk = true;

      try {
        const res = await fetch('https://holidays-jp.github.io/api/v1/date.json');
        if (!res.ok) throw new Error('API request failed');
        const apiData = await res.json();

        if (apiData && typeof apiData === 'object' && Object.keys(apiData).length > 0) {
          bulkApiData = apiData;
          hasFetchedBulkThisSession = true;
          try {
            localStorage.setItem(API_BULK_CACHE_KEY, JSON.stringify(apiData));
          } catch (e) {}

          // メモリキャッシュを再構築して再描画
          Object.keys(memoryHolidayCache).forEach(yStr => {
            const y = Number(yStr);
            const updated = { ...calculateHolidaysForYear(y) };
            const prefix = `${y}-`;
            Object.keys(apiData).forEach(k => {
              if (k.startsWith(prefix)) {
                updated[k] = apiData[k];
              }
            });
            memoryHolidayCache[y] = updated;
          });

          render();
        }
      } catch (err) {
        // オフライン・通信エラー時は自動計算フォールバックをそのまま使用
      } finally {
        isFetchingBulk = false;
      }
    }

    function getHolidayName(date) {
      const year = date.getFullYear();
      const holidays = getHolidaysForYear(year);
      return holidays[formatDateYMD(date)] || null;
    }

    const ROKUYO_LIST = ['大安', '赤口', '先勝', '友引', '先負', '仏滅'];

    // --- State 管理 ---
    const state = {
      currentDate: new Date(),
      view: 'month'
    };

    const THEME_KEY = 'smart_calendar_theme';

    function formatDateYMD(d) {
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }

    function isSameDay(d1, d2) {
      return (
        d1.getFullYear() === d2.getFullYear() &&
        d1.getMonth() === d2.getMonth() &&
        d1.getDate() === d2.getDate()
      );
    }

    function initTheme() {
      const saved = localStorage.getItem(THEME_KEY);
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
    }

    function updateDateLabel() {
      const d = state.currentDate;
      const y = d.getFullYear();
      const m = d.getMonth() + 1;
      const label = document.getElementById('currentDateLabel');

      if (state.view === 'month') {
        label.textContent = `${y}年 ${m}月`;
      } else if (state.view === 'week') {
        const start = getWeekStart(d);
        const end = new Date(start);
        end.setDate(start.getDate() + 6);
        if (start.getMonth() === end.getMonth()) {
          label.textContent = `${y}年 ${m}月 第${Math.ceil(d.getDate() / 7)}週`;
        } else {
          label.textContent = `${y}年 ${start.getMonth() + 1}月〜${end.getMonth() + 1}月`;
        }
      } else if (state.view === 'day') {
        const dayNames = ['日', '月', '火', '水', '木', '金', '土'];
        label.textContent = `${y}年 ${m}月 ${d.getDate()}日 (${dayNames[d.getDay()]})`;
      }
    }

    function getWeekStart(date) {
      const d = new Date(date);
      const day = d.getDay();
      const diffToMonday = (day + 6) % 7;
      d.setDate(d.getDate() - diffToMonday);
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function render() {
      updateDateLabel();
      updateViewButtons();

      const container = document.getElementById('calendarViewContainer');
      container.innerHTML = '';

      if (state.view === 'month') {
        renderMonthView(container);
      } else if (state.view === 'week') {
        renderWeekView(container);
      } else if (state.view === 'day') {
        renderDayView(container);
      }
    }

    function updateViewButtons() {
      document.querySelectorAll('.view-btn').forEach(btn => {
        if (btn.dataset.view === state.view) {
          btn.className = 'view-btn px-3.5 py-1.5 rounded-lg transition bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 font-extrabold shadow-xs';
        } else {
          btn.className = 'view-btn px-3.5 py-1.5 rounded-lg transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200';
        }
      });
    }

    // ==========================================
    // 1. 月ビュー (Month View) - 月曜始まり・動的週行数・くっきり枠線
    // ==========================================
    function renderMonthView(container) {
      const y = state.currentDate.getFullYear();
      const m = state.currentDate.getMonth();
      const firstDay = new Date(y, m, 1);
      const startDayIndex = (firstDay.getDay() + 6) % 7; // 月曜=0 ... 日曜=6
      const lastDate = new Date(y, m + 1, 0).getDate();
      const prevMonthLastDate = new Date(y, m, 0).getDate();

      // 月末の日付が含まれる週の日曜日までで終了（不要な翌月行を出さない）
      const totalCellsNeeded = startDayIndex + lastDate;
      const totalCells = Math.ceil(totalCellsNeeded / 7) * 7;

      const today = new Date();
      const dayHeaders = [
        { label: '月', colorClass: 'text-slate-700 dark:text-slate-200 bg-slate-100/90 dark:bg-slate-800' },
        { label: '火', colorClass: 'text-slate-700 dark:text-slate-200 bg-slate-100/90 dark:bg-slate-800' },
        { label: '水', colorClass: 'text-slate-700 dark:text-slate-200 bg-slate-100/90 dark:bg-slate-800' },
        { label: '木', colorClass: 'text-slate-700 dark:text-slate-200 bg-slate-100/90 dark:bg-slate-800' },
        { label: '金', colorClass: 'text-slate-700 dark:text-slate-200 bg-slate-100/90 dark:bg-slate-800' },
        { label: '土', colorClass: 'text-blue-700 dark:text-blue-300 bg-blue-100/90 dark:bg-blue-950/70 font-black' },
        { label: '日', colorClass: 'text-rose-700 dark:text-rose-300 bg-rose-100/90 dark:bg-rose-950/70 font-black' }
      ];

      let html = `
        <div class="grid grid-cols-7 border-b-2 border-slate-300 dark:border-slate-700 text-center text-xs sm:text-sm font-bold select-none divide-x divide-slate-300 dark:divide-slate-700">
          ${dayHeaders.map(h => `
            <div class="py-2.5 ${h.colorClass}">${h.label}</div>
          `).join('')}
        </div>
        <div class="grid grid-cols-7 flex-1 auto-rows-fr select-none bg-slate-300 dark:bg-slate-700 gap-[1px]">
      `;

      let dayCounter = 1;
      let nextMonthDayCounter = 1;

      for (let i = 0; i < totalCells; i++) {
        let cellDate;
        let isCurrentMonth = false;

        if (i < startDayIndex) {
          const pDay = prevMonthLastDate - (startDayIndex - 1 - i);
          cellDate = new Date(y, m - 1, pDay);
        } else if (dayCounter <= lastDate) {
          cellDate = new Date(y, m, dayCounter);
          dayCounter++;
          isCurrentMonth = true;
        } else {
          cellDate = new Date(y, m + 1, nextMonthDayCounter);
          nextMonthDayCounter++;
        }

        const dateStr = formatDateYMD(cellDate);
        const holiday = getHolidayName(cellDate);
        const isToday = isSameDay(cellDate, today);
        const dayOfWeek = cellDate.getDay();

        let cellBgClass = 'bg-white dark:bg-slate-900';
        let dateTextColor = 'text-slate-800 dark:text-slate-200 font-bold';

        if (dayOfWeek === 6) {
          // 土曜日（青系ハイライト）
          cellBgClass = isCurrentMonth
            ? 'bg-blue-100/55 dark:bg-blue-950/45'
            : 'bg-blue-100/20 dark:bg-blue-950/20 opacity-45';
          dateTextColor = 'text-blue-700 dark:text-blue-300 font-extrabold';
        } else if (dayOfWeek === 0 || holiday) {
          // 日曜日 または 祝日（ローズ赤系ハイライト）
          cellBgClass = isCurrentMonth
            ? 'bg-rose-100/55 dark:bg-rose-950/45'
            : 'bg-rose-100/20 dark:bg-rose-950/20 opacity-45';
          dateTextColor = 'text-rose-700 dark:text-rose-300 font-extrabold';
        } else if (!isCurrentMonth) {
          cellBgClass = 'bg-slate-100/75 dark:bg-slate-950/65 opacity-40';
          dateTextColor = 'text-slate-400 dark:text-slate-600 font-medium';
        }

        html += `
          <div data-date="${dateStr}" class="calendar-cell min-h-[84px] sm:min-h-[104px] p-1.5 sm:p-2 transition-colors hover:bg-slate-50 dark:hover:bg-slate-800/80 flex flex-col cursor-pointer ${cellBgClass}">
            <div class="flex items-start justify-between gap-1">
              <span class="font-mono inline-flex items-center justify-center w-7 h-7 text-xs sm:text-sm rounded-full shrink-0 ${
                isToday
                  ? 'bg-indigo-600 text-white font-extrabold shadow-xs ring-2 ring-indigo-300 dark:ring-indigo-900'
                  : dateTextColor
              }">
                ${cellDate.getDate()}
              </span>
              ${holiday ? `<span class="text-[10px] leading-tight text-rose-700 dark:text-rose-300 font-extrabold truncate max-w-[85px] bg-rose-200/85 dark:bg-rose-950 px-1.5 py-0.5 rounded border border-rose-300 dark:border-rose-800">${holiday}</span>` : ''}
            </div>

            <div class="mt-auto pt-2 flex justify-end">
              <span class="text-[10px] text-slate-400 dark:text-slate-500 font-medium">
                ${ROKUYO_LIST[(cellDate.getDate() + cellDate.getMonth()) % 6]}
              </span>
            </div>
          </div>
        `;
      }

      html += `</div>`;
      container.innerHTML = html;

      container.querySelectorAll('.calendar-cell').forEach(cell => {
        cell.addEventListener('click', () => {
          const [yy, mm, dd] = cell.dataset.date.split('-').map(Number);
          state.currentDate = new Date(yy, mm - 1, dd);
          state.view = 'day';
          render();
        });
      });
    }

    // ==========================================
    // 2. 週ビュー (Week View)
    // ==========================================
    function renderWeekView(container) {
      const weekStart = getWeekStart(state.currentDate);
      const days = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(weekStart);
        d.setDate(weekStart.getDate() + i);
        days.push(d);
      }

      const today = new Date();
      const dayNames = ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'];

      let html = `
        <div class="flex flex-col flex-1 divide-y divide-slate-300 dark:divide-slate-700 overflow-y-auto">
          ${days.map(d => {
            const isToday = isSameDay(d, today);
            const dateStr = formatDateYMD(d);
            const holiday = getHolidayName(d);
            const rokuyo = ROKUYO_LIST[(d.getDate() + d.getMonth()) % 6];
            const dayOfWeek = d.getDay();

            let rowBgClass = 'bg-white dark:bg-slate-900';
            let badgeClass = 'bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-300 dark:border-slate-700';
            let nameTextColor = 'text-slate-800 dark:text-slate-200 font-bold';

            if (isToday) {
              rowBgClass = 'bg-indigo-50/45 dark:bg-indigo-950/25';
              badgeClass = 'bg-indigo-600 text-white shadow-xs border border-indigo-700';
            } else if (dayOfWeek === 6) {
              rowBgClass = 'bg-blue-100/45 dark:bg-blue-950/35';
              badgeClass = 'bg-blue-200 dark:bg-blue-950 text-blue-800 dark:text-blue-200 font-black border border-blue-400 dark:border-blue-800';
              nameTextColor = 'text-blue-700 dark:text-blue-300 font-black';
            } else if (dayOfWeek === 0 || holiday) {
              rowBgClass = 'bg-rose-100/45 dark:bg-rose-950/35';
              badgeClass = 'bg-rose-200 dark:bg-rose-950 text-rose-800 dark:text-rose-200 font-black border border-rose-400 dark:border-rose-800';
              nameTextColor = 'text-rose-700 dark:text-rose-300 font-black';
            }

            return `
              <div data-date="${dateStr}" class="week-row p-4 sm:p-5 flex items-center justify-between hover:bg-slate-50 dark:hover:bg-slate-800/70 transition-colors cursor-pointer ${rowBgClass}">
                <div class="flex items-center space-x-4">
                  <div class="w-12 h-12 rounded-xl flex flex-col items-center justify-center font-mono font-bold shadow-2xs ${badgeClass}">
                    <span class="text-[10px] tracking-wider leading-none opacity-80">${d.getMonth() + 1}月</span>
                    <span class="text-lg leading-tight mt-0.5">${d.getDate()}</span>
                  </div>
                  <div>
                    <div class="flex items-center flex-wrap gap-2">
                      <span class="text-sm sm:text-base ${nameTextColor}">${dayNames[dayOfWeek]}</span>
                      ${holiday ? `<span class="text-xs px-2 py-0.5 rounded bg-rose-200 border border-rose-400 dark:bg-rose-950 text-rose-800 dark:text-rose-200 font-black">${holiday}</span>` : ''}
                      ${isToday ? `<span class="text-xs px-2 py-0.5 rounded bg-indigo-600 text-white font-bold">今日</span>` : ''}
                    </div>
                    <div class="text-xs text-slate-500 dark:text-slate-400 mt-0.5 font-medium">
                      六曜: ${rokuyo}
                    </div>
                  </div>
                </div>
                <div class="text-slate-400 dark:text-slate-500">
                  <i class="fa-solid fa-chevron-right text-xs"></i>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;

      container.innerHTML = html;

      container.querySelectorAll('.week-row').forEach(row => {
        row.addEventListener('click', () => {
          const [yy, mm, dd] = row.dataset.date.split('-').map(Number);
          state.currentDate = new Date(yy, mm - 1, dd);
          state.view = 'day';
          render();
        });
      });
    }

    // ==========================================
    // 3. 日ビュー (Day View)
    // ==========================================
    function renderDayView(container) {
      const d = state.currentDate;
      const holiday = getHolidayName(d);
      const dayNames = ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'];
      const dayOfWeek = d.getDay();
      const isToday = isSameDay(d, new Date());
      const rokuyo = ROKUYO_LIST[(d.getDate() + d.getMonth()) % 6];

      const startOfYear = new Date(d.getFullYear(), 0, 1);
      const dayOfYear = Math.floor((d - startOfYear) / (1000 * 60 * 60 * 24)) + 1;
      const totalDays = ((d.getFullYear() % 4 === 0 && d.getFullYear() % 100 !== 0) || d.getFullYear() % 400 === 0) ? 366 : 365;
      const yearProgress = Math.round((dayOfYear / totalDays) * 100);

      let dayAccentClass = 'text-slate-900 dark:text-white';
      let dayCardBorder = 'border-2 border-slate-300 dark:border-slate-700 bg-slate-50/80 dark:bg-slate-800/50';

      if (isToday) {
        dayAccentClass = 'text-indigo-600 dark:text-indigo-400';
        dayCardBorder = 'border-2 border-indigo-300 dark:border-indigo-800 bg-indigo-50/40 dark:bg-indigo-950/25';
      } else if (dayOfWeek === 6) {
        dayAccentClass = 'text-blue-700 dark:text-blue-400';
        dayCardBorder = 'border-2 border-blue-300 dark:border-blue-800 bg-blue-100/40 dark:bg-blue-950/30';
      } else if (dayOfWeek === 0 || holiday) {
        dayAccentClass = 'text-rose-700 dark:text-rose-400';
        dayCardBorder = 'border-2 border-rose-300 dark:border-rose-800 bg-rose-100/40 dark:bg-rose-950/30';
      }

      let html = `
        <div class="flex-1 flex flex-col items-center justify-center p-6 text-center">
          <div class="max-w-md w-full rounded-2xl p-8 ${dayCardBorder} shadow-xs flex flex-col items-center relative overflow-hidden">

            <span class="font-mono text-xs font-bold tracking-widest text-slate-600 dark:text-slate-300 uppercase bg-white dark:bg-slate-800 px-3 py-1 rounded-full border border-slate-300 dark:border-slate-700 mb-2">
              ${d.getFullYear()}年
            </span>

            <div class="font-mono text-7xl sm:text-8xl font-extrabold tracking-tight my-2 ${dayAccentClass}">
              ${d.getDate()}
            </div>

            <div class="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
              <span>${d.getMonth() + 1}月</span>
              <span>・</span>
              <span class="${dayOfWeek === 0 || holiday ? 'text-rose-700 dark:text-rose-300 font-extrabold' : dayOfWeek === 6 ? 'text-blue-700 dark:text-blue-300 font-extrabold' : ''}">${dayNames[dayOfWeek]}</span>
            </div>

            ${holiday ? `
              <div class="mt-3 px-3 py-1 rounded-full bg-rose-200 dark:bg-rose-950 text-rose-800 dark:text-rose-200 text-xs font-black border border-rose-400 dark:border-rose-800">
                祝日: ${holiday}
              </div>
            ` : ''}

            <!-- 詳細情報カード -->
            <div class="w-full grid grid-cols-2 gap-3 mt-6 pt-6 border-t border-slate-300 dark:border-slate-700 text-left">
              <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-300 dark:border-slate-700">
                <span class="text-xs text-slate-500 dark:text-slate-400 block font-bold">六曜</span>
                <span class="text-sm font-black text-slate-800 dark:text-slate-200">${rokuyo}</span>
              </div>
              <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-300 dark:border-slate-700">
                <span class="text-xs text-slate-500 dark:text-slate-400 block font-bold">通日 / 年間進捗</span>
                <span class="font-mono text-sm font-extrabold text-slate-800 dark:text-slate-200">${dayOfYear}日目 (${yearProgress}%)</span>
              </div>
            </div>

            <button id="backToMonthBtn" class="mt-6 text-xs text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 inline-flex items-center gap-1.5 font-bold bg-white dark:bg-slate-800 px-3.5 py-2 rounded-xl border border-slate-300 dark:border-slate-700 shadow-2xs active:scale-95 transition">
              <i class="fa-regular fa-calendar-days"></i>
              <span>月表示に戻る</span>
            </button>
          </div>
        </div>
      `;

      container.innerHTML = html;

      const backBtn = container.querySelector('#backToMonthBtn');
      if (backBtn) {
        backBtn.addEventListener('click', () => {
          state.view = 'month';
          render();
        });
      }
    }

    // --- ナビゲーション処理 ---
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (state.view === 'month') {
        state.currentDate.setMonth(state.currentDate.getMonth() - 1);
      } else if (state.view === 'week') {
        state.currentDate.setDate(state.currentDate.getDate() - 7);
      } else if (state.view === 'day') {
        state.currentDate.setDate(state.currentDate.getDate() - 1);
      }
      render();
    });

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (state.view === 'month') {
        state.currentDate.setMonth(state.currentDate.getMonth() + 1);
      } else if (state.view === 'week') {
        state.currentDate.setDate(state.currentDate.getDate() + 7);
      } else if (state.view === 'day') {
        state.currentDate.setDate(state.currentDate.getDate() + 1);
      }
      render();
    });

    document.getElementById('todayBtn').addEventListener('click', () => {
      state.currentDate = new Date();
      render();
    });

    document.querySelectorAll('.view-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.view = btn.dataset.view;
        render();
      });
    });

    document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);

    // --- 初期起動処理 ---
    window.onload = function() {
      initTheme();
      render();
    };
  </script>
</body>
</html>
