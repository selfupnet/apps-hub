<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>五目並べ | Apps Hub</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans JP"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      user-select: none;
      -webkit-user-select: none;
    }
    #board-container {
      aspect-ratio: 1 / 1;
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased flex flex-col justify-between transition-colors duration-200">

  <!-- ========================================== -->
  <!-- ヘッダー (Apps Hub 統一規格)                -->
  <!-- ========================================== -->
  <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between gap-2">
      <!-- 左端: 統一戻りリンク -->
      <a href="../" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition py-1.5 px-3 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 shrink-0">
        <i class="fa-solid fa-arrow-left text-[10px]"></i>
        <span>Apps Hub</span>
      </a>

      <!-- 中央: アイコン + タイトル -->
      <div class="flex items-center gap-2 truncate">
        <div class="w-7 h-7 rounded-lg bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-sm shrink-0">
          <i class="fa-solid fa-circle-dot"></i>
        </div>
        <h1 class="text-sm sm:text-base font-extrabold tracking-tight truncate">五目並べ</h1>
      </div>

      <!-- 右端: 実動する共通コントロール（音声ON/OFF・テーマ切替） -->
      <div class="flex items-center gap-1.5 shrink-0">
        <button type="button" id="sound-btn" onclick="toggleSound()" aria-label="音声切り替え" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center text-xs transition">
          <i id="sound-icon" class="fa-solid fa-volume-high"></i>
        </button>
        <button type="button" id="theme-btn" onclick="toggleTheme()" aria-label="テーマ切り替え" class="w-8 h-8 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 flex items-center justify-center text-xs transition">
          <i id="theme-icon" class="fa-solid fa-moon"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- メインコンテンツ                            -->
  <!-- ========================================== -->
  <main class="flex-1 w-full max-w-xl mx-auto px-4 py-4 sm:py-6 flex flex-col gap-3 sm:gap-4">

    <!-- インライン設定＆ステータスパネル -->
    <section class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 p-3 sm:p-4 shadow-xs flex flex-col gap-3">
      
      <!-- 上段: モード・強さ・手数 -->
      <div class="flex items-center justify-between flex-wrap gap-2">
        <div class="flex items-center gap-2 flex-wrap">
          <!-- 対戦モード切替 -->
          <div class="inline-flex bg-slate-100 dark:bg-slate-800 p-1 rounded-xl">
            <button type="button" id="mode-cpu" onclick="setGameMode('cpu')" class="px-3 py-1 rounded-lg text-xs font-bold transition bg-indigo-600 text-white shadow-xs">
              vs CPU
            </button>
            <button type="button" id="mode-human" onclick="setGameMode('human')" class="px-3 py-1 rounded-lg text-xs font-bold transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
              2人対局
            </button>
          </div>

          <!-- CPU強さ選択 -->
          <div id="ai-level-group" class="flex items-center gap-1.5">
            <select id="ai-level" onchange="changeDifficulty(this.value)" aria-label="CPUの強さ" class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200/80 dark:border-slate-700 px-2.5 py-1.5 rounded-xl text-xs font-bold outline-none focus:border-indigo-500 cursor-pointer">
              <option value="easy">初級</option>
              <option value="medium" selected>中級</option>
              <option value="hard">上級</option>
            </select>
          </div>
        </div>

        <!-- 手数カウンター (等幅フォント) -->
        <div class="px-2.5 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-mono font-bold text-slate-600 dark:text-slate-300">
          <span id="move-count">0</span>手目
        </div>
      </div>

      <!-- 下段: 手番ステータス ＆ アクションボタン -->
      <div class="flex items-center justify-between flex-wrap gap-2 pt-2.5 border-t border-slate-100 dark:border-slate-800">
        <div class="flex items-center gap-2">
          <span id="turn-dot" class="w-3.5 h-3.5 rounded-full bg-slate-900 border border-slate-400/50 shadow-xs inline-block shrink-0"></span>
          <span id="turn-text" class="text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-100">黒の手番 (あなた)</span>
        </div>

        <div class="flex items-center gap-1.5">
          <button type="button" id="color-swap-btn" onclick="swapPlayerColor()" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 transition">
            <i class="fa-solid fa-right-left text-[10px]"></i>
            <span>先後交代</span>
          </button>
          <button type="button" id="undo-btn" onclick="undoMove()" disabled class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 disabled:opacity-40 disabled:pointer-events-none transition">
            <i class="fa-solid fa-rotate-left text-[10px]"></i>
            <span>待った</span>
          </button>
          <button type="button" onclick="restartGame()" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded-xl text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/60 hover:bg-indigo-100 dark:hover:bg-indigo-900/60 text-indigo-600 dark:text-indigo-400 transition">
            <i class="fa-solid fa-arrows-rotate text-[10px]"></i>
            <span>最初から</span>
          </button>
        </div>
      </div>

    </section>

    <!-- 盤面カードコンテナ -->
    <section class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 p-2.5 sm:p-3.5 shadow-xs">
      <div id="board-container" class="w-full relative rounded-2xl overflow-hidden shadow-inner border border-amber-900/30">
        <canvas id="board-canvas" class="w-full h-full block cursor-pointer"></canvas>

        <!-- 終局結果オーバーレイ -->
        <div id="modal-overlay" class="hidden absolute inset-0 bg-slate-900/60 backdrop-blur-xs flex-col items-center justify-center p-4">
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 px-6 py-5 rounded-2xl text-center shadow-lg max-w-xs w-full space-y-3">
            <div class="w-10 h-10 rounded-xl bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-lg mx-auto">
              <i class="fa-solid fa-trophy"></i>
            </div>
            <div id="modal-text" class="text-lg font-extrabold text-slate-800 dark:text-slate-100">黒の勝利！</div>
            <button type="button" onclick="restartGame()" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition shadow-xs">
              もう一度対局する
            </button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ========================================== -->
  <!-- フッター (Apps Hub 個別アプリ 正式共通規格)   -->
  <!-- ========================================== -->
  <footer class="mt-8 py-6 text-center border-t border-slate-200 dark:border-slate-800">
    <div class="max-w-4xl mx-auto px-4">
      <p class="text-[11px] text-slate-400">
        ※個人開発プロトタイプにつき無保証・自己責任にてご利用ください（データは端末内完結・サポート対象外）
      </p>
    </div>
  </footer>

<script>
  const BOARD_SIZE = 15;
  const EMPTY = 0;
  const BLACK = 1;
  const WHITE = 2;

  let board = [];
  let history = [];
  let currentTurn = BLACK;
  let isGameOver = false;
  let gameMode = 'cpu'; // 'cpu' or 'human'
  let playerColor = BLACK; // CPU戦でのプレイヤー石色
  let aiLevel = 'medium';
  let soundEnabled = true;
  let winningLine = null;
  let hoverCell = null;

  const canvas = document.getElementById('board-canvas');
  const ctx = canvas.getContext('2d');
  const container = document.getElementById('board-container');

  // テーマ管理 (localStorage)
  function initTheme() {
    const saved = localStorage.getItem('appshub_gomoku_theme');
    const isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', isDark);
    updateThemeIcon(isDark);
  }

  function toggleTheme() {
    const isDark = document.documentElement.classList.toggle('dark');
    localStorage.setItem('appshub_gomoku_theme', isDark ? 'dark' : 'light');
    updateThemeIcon(isDark);
  }

  function updateThemeIcon(isDark) {
    const icon = document.getElementById('theme-icon');
    icon.className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
  }

  // Web Audio API シンセ音（外部ファイル不要・完全ローカル）
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  function playSound(type) {
    if (!soundEnabled) return;
    try {
      const actx = getAudioCtx();
      const now = actx.currentTime;

      if (type === 'place') {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.05);

        gain.gain.setValueAtTime(0.65, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start(now);
        osc.stop(now + 0.05);
      } else if (type === 'win') {
        const freqs = [523.25, 659.25, 783.99, 1046.5];
        freqs.forEach((f, i) => {
          const osc = actx.createOscillator();
          const gain = actx.createGain();
          osc.type = 'sine';
          osc.frequency.value = f;
          gain.gain.setValueAtTime(0, now + i * 0.1);
          gain.gain.linearRampToValueAtTime(0.18, now + i * 0.1 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.4);
          osc.connect(gain);
          gain.connect(actx.destination);
          osc.start(now + i * 0.1);
          osc.stop(now + i * 0.1 + 0.4);
        });
      }
    } catch (e) {}
  }

  function initBoard() {
    board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(EMPTY));
    history = [];
    currentTurn = BLACK;
    isGameOver = false;
    winningLine = null;
    hoverCell = null;
    const modal = document.getElementById('modal-overlay');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    updateUI();
    render();

    if (gameMode === 'cpu' && playerColor === WHITE) {
      setTimeout(cpuTurn, 380);
    }
  }

  function resizeCanvas() {
    const rect = container.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    render();
  }

  window.addEventListener('resize', resizeCanvas);

  function getMetrics() {
    const rect = container.getBoundingClientRect();
    const width = rect.width || 400;
    const padding = width * 0.06;
    const gridSpan = (width - padding * 2) / (BOARD_SIZE - 1);
    return { padding, gridSpan, width };
  }

  function render() {
    if (!board || board.length !== BOARD_SIZE || !board[0]) return;

    const { padding, gridSpan, width } = getMetrics();
    ctx.clearRect(0, 0, width, width);

    // 1. 木目調盤面背景
    const grad = ctx.createLinearGradient(0, 0, width, width);
    grad.addColorStop(0, '#ebbb74');
    grad.addColorStop(1, '#d4984c');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, width, width);

    // 微細な木目ライン
    ctx.strokeStyle = 'rgba(90, 45, 10, 0.06)';
    ctx.lineWidth = 1;
    for (let i = 0; i < width; i += 7) {
      ctx.beginPath();
      ctx.moveTo(0, i);
      ctx.lineTo(width, i);
      ctx.stroke();
    }

    // 2. 格子線
    ctx.strokeStyle = '#47280a';
    ctx.lineWidth = 1.2;
    for (let i = 0; i < BOARD_SIZE; i++) {
      const pos = padding + i * gridSpan;
      ctx.beginPath();
      ctx.moveTo(padding, pos);
      ctx.lineTo(width - padding, pos);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(pos, padding);
      ctx.lineTo(pos, width - padding);
      ctx.stroke();
    }

    // 3. 星（天元など5箇所）
    const stars = [3, 7, 11];
    ctx.fillStyle = '#47280a';
    for (let x of stars) {
      for (let y of stars) {
        if ((x === 7 && y === 7) || (x !== 7 && y !== 7)) {
          ctx.beginPath();
          ctx.arc(padding + x * gridSpan, padding + y * gridSpan, 3.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // 4. 着手プレビュー（ホバー）
    if (!isGameOver && hoverCell && board[hoverCell.y] && board[hoverCell.y][hoverCell.x] === EMPTY) {
      const isPlayerTurn = gameMode === 'human' || currentTurn === playerColor;
      if (isPlayerTurn) {
        const cx = padding + hoverCell.x * gridSpan;
        const cy = padding + hoverCell.y * gridSpan;
        ctx.beginPath();
        ctx.arc(cx, cy, gridSpan * 0.42, 0, Math.PI * 2);
        ctx.fillStyle = currentTurn === BLACK ? 'rgba(15, 23, 42, 0.25)' : 'rgba(255, 255, 255, 0.45)';
        ctx.fill();
      }
    }

    // 5. 碁石描画
    for (let y = 0; y < BOARD_SIZE; y++) {
      if (!board[y]) continue;
      for (let x = 0; x < BOARD_SIZE; x++) {
        const val = board[y][x];
        if (val !== EMPTY) {
          drawStone(x, y, val, padding, gridSpan);
        }
      }
    }

    // 6. 直前の着手マーカー
    if (history.length > 0) {
      const last = history[history.length - 1];
      const cx = padding + last.x * gridSpan;
      const cy = padding + last.y * gridSpan;
      ctx.beginPath();
      ctx.arc(cx, cy, gridSpan * 0.15, 0, Math.PI * 2);
      ctx.fillStyle = '#4f46e5';
      ctx.fill();
    }

    // 7. 勝利5連ライン強調
    if (winningLine && winningLine.length > 0) {
      ctx.beginPath();
      const p1 = winningLine[0];
      const p2 = winningLine[winningLine.length - 1];
      ctx.moveTo(padding + p1.x * gridSpan, padding + p1.y * gridSpan);
      ctx.lineTo(padding + p2.x * gridSpan, padding + p2.y * gridSpan);
      ctx.strokeStyle = '#ef4444';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
  }

  function drawStone(x, y, color, padding, gridSpan) {
    const cx = padding + x * gridSpan;
    const cy = padding + y * gridSpan;
    const r = gridSpan * 0.43;

    // 影
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx + 1.5, cy + 2.5, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
    ctx.fill();
    ctx.restore();

    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);

    const grad = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
    if (color === BLACK) {
      grad.addColorStop(0, '#52525b');
      grad.addColorStop(0.6, '#18181b');
      grad.addColorStop(1, '#09090b');
    } else {
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.7, '#f8fafc');
      grad.addColorStop(1, '#cbd5e1');
    }
    ctx.fillStyle = grad;
    ctx.fill();
  }

  function getCellFromCoords(clientX, clientY) {
    const rect = container.getBoundingClientRect();
    const { padding, gridSpan } = getMetrics();
    const x = clientX - rect.left - padding;
    const y = clientY - rect.top - padding;

    const cellX = Math.round(x / gridSpan);
    const cellY = Math.round(y / gridSpan);

    if (cellX >= 0 && cellX < BOARD_SIZE && cellY >= 0 && cellY < BOARD_SIZE) {
      return { x: cellX, y: cellY };
    }
    return null;
  }

  container.addEventListener('pointerdown', (e) => {
    if (isGameOver) return;
    if (gameMode === 'cpu' && currentTurn !== playerColor) return;

    const cell = getCellFromCoords(e.clientX, e.clientY);
    if (cell && board[cell.y][cell.x] === EMPTY) {
      placeStone(cell.x, cell.y);
    }
  });

  container.addEventListener('pointermove', (e) => {
    const cell = getCellFromCoords(e.clientX, e.clientY);
    hoverCell = cell;
    render();
  });

  container.addEventListener('pointerleave', () => {
    hoverCell = null;
    render();
  });

  function placeStone(x, y) {
    board[y][x] = currentTurn;
    history.push({ x, y, color: currentTurn });
    playSound('place');

    const winData = checkWin(x, y, currentTurn);
    if (winData) {
      isGameOver = true;
      winningLine = winData;
      playSound('win');
      updateUI();
      render();
      showWinner(currentTurn);
      return;
    }

    if (history.length === BOARD_SIZE * BOARD_SIZE) {
      isGameOver = true;
      updateUI();
      render();
      showDraw();
      return;
    }

    currentTurn = currentTurn === BLACK ? WHITE : BLACK;
    updateUI();
    render();

    if (!isGameOver && gameMode === 'cpu' && currentTurn !== playerColor) {
      setTimeout(cpuTurn, 300);
    }
  }

  function checkWin(x, y, color) {
    const directions = [
      [{ dx: 1, dy: 0 }, { dx: -1, dy: 0 }],
      [{ dx: 0, dy: 1 }, { dx: 0, dy: -1 }],
      [{ dx: 1, dy: 1 }, { dx: -1, dy: -1 }],
      [{ dx: 1, dy: -1 }, { dx: -1, dy: 1 }]
    ];

    for (let dir of directions) {
      let line = [{ x, y }];
      for (let side of dir) {
        let step = 1;
        while (true) {
          const nx = x + side.dx * step;
          const ny = y + side.dy * step;
          if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[ny][nx] === color) {
            line.push({ x: nx, y: ny });
            step++;
          } else {
            break;
          }
        }
      }
      if (line.length >= 5) {
        return line;
      }
    }
    return null;
  }

  function cpuTurn() {
    if (isGameOver) return;
    const move = chooseAiMove();
    if (move) {
      placeStone(move.x, move.y);
    }
  }

  function chooseAiMove() {
    if (history.length === 0) {
      return { x: 7, y: 7 };
    }

    const cpuColor = currentTurn;
    const humanColor = cpuColor === BLACK ? WHITE : BLACK;

    const myWinningMove = findWinningMove(cpuColor);
    if (myWinningMove) return myWinningMove;

    if (aiLevel !== 'easy') {
      const opponentWinningMove = findWinningMove(humanColor);
      if (opponentWinningMove) return opponentWinningMove;
    }

    let bestScore = -Infinity;
    let bestMoves = [];

    for (let y = 0; y < BOARD_SIZE; y++) {
      for (let x = 0; x < BOARD_SIZE; x++) {
        if (board[y][x] === EMPTY) {
          if (!hasNeighbor(x, y, 2)) continue;

          let score = evaluateCell(x, y, cpuColor, humanColor);

          if (aiLevel === 'easy') {
            score += Math.random() * 80;
          } else if (aiLevel === 'medium') {
            score += Math.random() * 20;
          }

          if (score > bestScore) {
            bestScore = score;
            bestMoves = [{ x, y }];
          } else if (score === bestScore) {
            bestMoves.push({ x, y });
          }
        }
      }
    }

    if (bestMoves.length > 0) {
      return bestMoves[Math.floor(Math.random() * bestMoves.length)];
    }
    return { x: 7, y: 7 };
  }

  function hasNeighbor(x, y, distance) {
    for (let dy = -distance; dy <= distance; dy++) {
      for (let dx = -distance; dx <= distance; dx++) {
        const nx = x + dx;
        const ny = y + dy;
        if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE) {
          if (board[ny][nx] !== EMPTY) return true;
        }
      }
    }
    return false;
  }

  function findWinningMove(color) {
    for (let y = 0; y < BOARD_SIZE; y++) {
      for (let x = 0; x < BOARD_SIZE; x++) {
        if (board[y][x] === EMPTY) {
          board[y][x] = color;
          const isWin = checkWin(x, y, color);
          board[y][x] = EMPTY;
          if (isWin) return { x, y };
        }
      }
    }
    return null;
  }

  function evaluateCell(x, y, myColor, oppColor) {
    let score = 0;
    const distFromCenter = Math.abs(x - 7) + Math.abs(y - 7);
    score += (14 - distFromCenter);

    const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
    for (let [dx, dy] of dirs) {
      const myCount = countConsecutive(x, y, dx, dy, myColor);
      const oppCount = countConsecutive(x, y, dx, dy, oppColor);

      if (myCount >= 4) score += 100000;
      else if (oppCount >= 4) score += 40000;
      else if (myCount === 3) score += 5000;
      else if (oppCount === 3) score += 2000;
      else if (myCount === 2) score += 300;
    }
    return score;
  }

  function countConsecutive(x, y, dx, dy, color) {
    let count = 0;
    for (let step = 1; step <= 4; step++) {
      const nx = x + dx * step;
      const ny = y + dy * step;
      if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[ny][nx] === color) {
        count++;
      } else break;
    }
    for (let step = 1; step <= 4; step++) {
      const nx = x - dx * step;
      const ny = y - dy * step;
      if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[ny][nx] === color) {
        count++;
      } else break;
    }
    return count;
  }

  function updateUI() {
    document.getElementById('move-count').textContent = history.length;
    const turnDot = document.getElementById('turn-dot');
    const turnText = document.getElementById('turn-text');

    if (currentTurn === BLACK) {
      turnDot.className = 'w-3.5 h-3.5 rounded-full bg-slate-900 border border-slate-500 shadow-xs inline-block shrink-0';
    } else {
      turnDot.className = 'w-3.5 h-3.5 rounded-full bg-white border border-slate-300 shadow-xs inline-block shrink-0';
    }

    if (gameMode === 'human') {
      turnText.textContent = currentTurn === BLACK ? '黒の手番 (P1)' : '白の手番 (P2)';
    } else {
      if (currentTurn === playerColor) {
        turnText.textContent = `${currentTurn === BLACK ? '黒' : '白'}の手番 (あなた)`;
      } else {
        turnText.textContent = `${currentTurn === BLACK ? '黒' : '白'}の手番 (CPU思考中...)`;
      }
    }

    document.getElementById('undo-btn').disabled = history.length === 0 || isGameOver;
  }

  function setGameMode(mode) {
    gameMode = mode;
    const btnCpu = document.getElementById('mode-cpu');
    const btnHuman = document.getElementById('mode-human');

    if (mode === 'cpu') {
      btnCpu.className = 'px-3 py-1 rounded-lg text-xs font-bold transition bg-indigo-600 text-white shadow-xs';
      btnHuman.className = 'px-3 py-1 rounded-lg text-xs font-bold transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
    } else {
      btnHuman.className = 'px-3 py-1 rounded-lg text-xs font-bold transition bg-indigo-600 text-white shadow-xs';
      btnCpu.className = 'px-3 py-1 rounded-lg text-xs font-bold transition text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white';
    }

    document.getElementById('ai-level-group').style.display = mode === 'cpu' ? 'flex' : 'none';
    document.getElementById('color-swap-btn').style.display = mode === 'cpu' ? 'inline-flex' : 'none';
    restartGame();
  }

  function changeDifficulty(val) {
    aiLevel = val;
  }

  function swapPlayerColor() {
    playerColor = playerColor === BLACK ? WHITE : BLACK;
    restartGame();
  }

  function undoMove() {
    if (history.length === 0 || isGameOver) return;

    if (gameMode === 'cpu') {
      const steps = currentTurn === playerColor ? 2 : 1;
      for (let i = 0; i < steps; i++) {
        if (history.length > 0) {
          const last = history.pop();
          board[last.y][last.x] = EMPTY;
        }
      }
      currentTurn = playerColor;
    } else {
      const last = history.pop();
      board[last.y][last.x] = EMPTY;
      currentTurn = last.color;
    }

    winningLine = null;
    isGameOver = false;
    const modal = document.getElementById('modal-overlay');
    modal.classList.add('hidden');
    modal.classList.remove('flex');
    updateUI();
    render();
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    const icon = document.getElementById('sound-icon');
    icon.className = soundEnabled ? 'fa-solid fa-volume-high' : 'fa-solid fa-volume-xmark text-slate-400';
  }

  function showWinner(winner) {
    const modal = document.getElementById('modal-overlay');
    const text = document.getElementById('modal-text');
    const colorStr = winner === BLACK ? '黒' : '白';

    if (gameMode === 'human') {
      text.textContent = `${colorStr}の勝利！`;
    } else {
      text.textContent = winner === playerColor ? 'あなたの勝利！' : 'CPUの勝利！';
    }
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }

  function showDraw() {
    const modal = document.getElementById('modal-overlay');
    const text = document.getElementById('modal-text');
    text.textContent = '引き分けです！';
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  }

  function restartGame() {
    initBoard();
  }

  window.addEventListener('DOMContentLoaded', () => {
    initTheme();
    initBoard();
    resizeCanvas();
  });
</script>
</body>
