えられます。`,tipJa:`オリオン座の三ツ星を右斜め上に伸ばすとアルデバラン、さらに伸ばすと肉眼でも星が集まって見える「すばる」に出会えます。`},{id:`Aur`,nameJa:`ぎょしゃ座`,readingJa:`ぎょしゃざ`,nameLatin:`Auriga`,season:`冬`,ra:5.55,dec:40.5,mainStarId:`ALP_AUR`,lines:[[`ALP_AUR`,`BET_AUR`],[`BET_AUR`,`THE_AUR`],[`THE_AUR`,`BET_TAU`],[`BET_TAU`,`IOT_AUR`],[`IOT_AUR`,`ALP_AUR`]],summaryJa:`黄金色の1等星カペラを頂点に、大きな五角形（ホームベース型）を描く冬の星座。`,mythJa:`4頭立ての戦車を発明したアテネの王エリクトニオスが、子ヤギを抱いて手綱を握る姿が描かれます。`,tipJa:`冬の夜、頭上高く見上げると将棋の駒のような大きな五角形がすぐに見つかります。`},{id:`Gem`,nameJa:`ふたご座`,readingJa:`ふたござ`,nameLatin:`Gemini`,season:`冬`,ra:7.1,dec:23.5,mainStarId:`BET_GEM`,lines:[[`ALP_GEM`,`BET_GEM`],[`ALP_GEM`,`EPS_GEM`],[`EPS_GEM`,`MU_GEM`],[`BET_GEM`,`DEL_GEM`],[`DEL_GEM`,`GAM_GEM`],[`DEL_GEM`,`XI_GEM`]],summaryJa:`仲良く並んだ2つの明るい星カストルとポルックスが双子の頭を表す黄道十二星座。`,mythJa:`兄カストルと不死身の弟ポルックスの固い兄弟愛に感動したゼウスが、二人を並べて天に上げました。`,tipJa:`12月中旬には年間最大級の「ふたご座流星群」がこの星座の付近から放射状に流れます。`},{id:`UMa`,nameJa:`おおぐま座`,readingJa:`おおぐまざ`,nameLatin:`Ursa Major`,season:`春`,ra:11.4,dec:54.5,mainStarId:`EPS_UMA`,lines:[[`ALP_UMA`,`BET_UMA`],[`BET_UMA`,`GAM_UMA`],[`GAM_UMA`,`DEL_UMA`],[`DEL_UMA`,`ALP_UMA`],[`DEL_UMA`,`EPS_UMA`],[`EPS_UMA`,`ZET_UMA`],[`ZET_UMA`,`ETA_UMA`],[`ALP_UMA`,`OMI_UMA`],[`OMI_UMA`,`UPS_UMA`],[`UPS_UMA`,`THE_UMA`],[`BET_UMA`,`PSI_UMA`],[`PSI_UMA`,`MU_UMA`]],summaryJa:`有名な「北斗七星」を背中から尻尾に含む、全天で3番目に大きな星座。`,mythJa:`森の妖精カリストが女神の嫉妬で熊に変えられ、息子アルカス（こぐま座）とともに天へ上げられました。`,tipJa:`北斗七星は北極星探しにも、春の1等星探し（春の大曲線）にも大活躍する万能の道標です。`},{id:`UMi`,nameJa:`こぐま座`,readingJa:`こぐまざ`,nameLatin:`Ursa Minor`,season:`周極`,ra:15.2,dec:78.5,mainStarId:`ALP_UMI`,lines:[[`ALP_UMI`,`DEL_UMI`],[`DEL_UMI`,`EPS_UMI`],[`EPS_UMI`,`ZET_UMI`],[`ZET_UMI`,`BET_UMI`],[`BET_UMI`,`GAM_UMI`],[`GAM_UMI`,`ETA_UMI`],[`ETA_UMI`,`ZET_UMI`]],summaryJa:`尻尾の先端に北極星（ポラリス）が輝く、小さなひしゃく型（小北斗）の周極星座。`,mythJa:`おおぐま座のカリストの息子アルカスの姿。北の空で一晩中沈まずに回り続けます。`,tipJa:`北極星自体は2等星で、都会ではやや控えめに見えます。まず北斗七星かカシオペヤ座から探すのが確実です。`},{id:`Cas`,nameJa:`カシオペヤ座`,readingJa:`かしおぺやざ`,nameLatin:`Cassiopeia`,season:`秋`,ra:1,dec:60.5,mainStarId:`ALP_CAS`,lines:[[`BET_CAS`,`ALP_CAS`],[`ALP_CAS`,`GAM_CAS`],[`GAM_CAS`,`DEL_CAS`],[`DEL_CAS`,`EPS_CAS`]],summaryJa:`北の空にくっきりと「W」や「M」の形を描く、北極星探しのもう一つの主役。`,mythJa:`古代エチオピアの王妃カシオペヤ。美貌を自慢しすぎたため、椅子に座ったまま逆さまにもなる姿で天に置かれました。`,tipJa:`秋〜冬は北の高い空にM字型に見えます。濃い天の川の中にあるため、双眼鏡で流すと星がぎっしり見えます。`},{id:`Leo`,nameJa:`しし座`,readingJa:`ししざ`,nameLatin:`Leo`,season:`春`,ra:10.65,dec:17,mainStarId:`ALP_LEO`,lines:[[`EPS_LEO`,`MU_LEO`],[`MU_LEO`,`ZET_LEO`],[`ZET_LEO`,`GAM_LEO`],[`GAM_LEO`,`ETA_LEO`],[`ETA_LEO`,`ALP_LEO`],[`GAM_LEO`,`DEL_LEO`],[`DEL_LEO`,`BET_LEO`],[`BET_LEO`,`THE_LEO`],[`THE_LEO`,`DEL_LEO`],[`ALP_LEO`,`THE_LEO`]],summaryJa:`勇壮なライオンの姿がそのまま浮かぶ春の代表星座。「ししの大鎌」と尻尾の三角形が目印。`,mythJa:`英雄ヘルクレスが最初の冒険で退治した、どんな武器も通さないネメアの化け獅子です。`,tipJa:`北斗七星のひしゃくの底を反対方向（南）へ伸ばすと、しし座の背中にぶつかります。`},{id:`Boo`,nameJa:`うしかい座`,readingJa:`うしかいざ`,nameLatin:`Bootes`,season:`春`,ra:14.55,dec:28.5,mainStarId:`ALP_BOO`,lines:[[`ALP_BOO`,`ETA_BOO`],[`ALP_BOO`,`EPS_BOO`],[`EPS_BOO`,`DEL_BOO`],[`DEL_BOO`,`BET_BOO`],[`BET_BOO`,`GAM_BOO`],[`GAM_BOO`,`RHO_BOO`],[`RHO_BOO`,`ALP_BOO`]],summaryJa:`オレンジ色の0等星アークトゥルスを下に据えた、ネクタイ（またはのし袋）型の春の星座。`,mythJa:`おおぐま座を見張る番人、または農耕を始めた牛飼いの姿とされます。`,tipJa:`北斗七星の柄のカーブを伸ばせば必ずアークトゥルスに行き着くため、春の星空案内の起点に最適です。`},{id:`Vir`,nameJa:`おとめ座`,readingJa:`おとめざ`,nameLatin:`Virgo`,season:`春`,ra:13.05,dec:-2,mainStarId:`ALP_VIR`,lines:[[`BET_VIR`,`ETA_VIR`],[`ETA_VIR`,`GAM_VIR`],[`GAM_VIR`,`DEL_VIR`],[`DEL_VIR`,`EPS_VIR`],[`GAM_VIR`,`ALP_VIR`],[`DEL_VIR`,`ZET_VIR`],[`ZET_VIR`,`ALP_VIR`]],summaryJa:`青白い1等星スピカが輝く、全天で2番目に広い黄道十二星座。`,mythJa:`豊穣の女神デメテル、または正義の女神アストライアが麦の穂を手にした姿とされます。`,tipJa:`スピカ・アークトゥルス・デネボラを結ぶと、春の空に大きな「春の大三角」が現れます。`},{id:`Crv`,nameJa:`からす座`,readingJa:`からすざ`,nameLatin:`Corvus`,season:`春`,ra:12.38,dec:-19.8,lines:[[`GAM_CRV`,`DEL_CRV`],[`DEL_CRV`,`BET_CRV`],[`BET_CRV`,`EPS_CRV`],[`EPS_CRV`,`GAM_CRV`]],summaryJa:`スピカの南西にちょこんと並ぶ、特徴的な4つの星の台形（帆掛け舟の形）。`,mythJa:`太陽神アポロンに仕えた真っ白なカラスが、嘘をついた罰で真っ黒にされて天に上げられました。`,tipJa:`コンパクトで形が整っているため、春の南の空でスピカを見つけたらすぐ隣を探してみてください。`},{id:`CrB`,nameJa:`かんむり座`,readingJa:`かんむりざ`,nameLatin:`Corona Borealis`,season:`春`,ra:15.65,dec:28,mainStarId:`ALP_CRB`,lines:[[`THE_CRB`,`BET_CRB`],[`BET_CRB`,`ALP_CRB`],[`ALP_CRB`,`GAM_CRB`],[`GAM_CRB`,`DEL_CRB`],[`DEL_CRB`,`EPS_CRB`]],summaryJa:`美しい半円形に星が連なる宝石の冠。中央で2等星アルフェッカが輝きます。`,mythJa:`酒神ディオニュソスがクレタ島の王女アリアドネに贈った黄金の冠です。`,tipJa:`うしかい座とヘルクレス座の間で、くっきりとしたU字（お椀型）の並びを探しましょう。`},{id:`Lyr`,nameJa:`こと座`,readingJa:`ことざ`,nameLatin:`Lyra`,season:`夏`,ra:18.8,dec:36.2,mainStarId:`ALP_LYR`,lines:[[`ALP_LYR`,`EPS_LYR`],[`ALP_LYR`,`ZET_LYR`],[`ZET_LYR`,`DEL2_LYR`],[`DEL2_LYR`,`GAM_LYR`],[`GAM_LYR`,`BET_LYR`],[`BET_LYR`,`ZET_LYR`]],summaryJa:`七夕のおりひめ星「ベガ」と、小さな平行四辺形が寄り添う可憐な夏の星座。`,mythJa:`音楽の名手オルフェウスが奏でた竪琴。その美しい音色は動物や岩さえも聴き入ったと言われます。`,tipJa:`ベガのすぐそばにある平行四辺形の下の2星の間には、有名なリング星雲（M57）があります。`},{id:`Cyg`,nameJa:`はくちょう座`,readingJa:`はくちょうざ`,nameLatin:`Cygnus`,season:`夏`,ra:20.25,dec:40.5,mainStarId:`ALP_CYG`,lines:[[`ALP_CYG`,`GAM_CYG`],[`GAM_CYG`,`BET_CYG`],[`IOT_CYG`,`DEL_CYG`],[`DEL_CYG`,`GAM_CYG`],[`GAM_CYG`,`EPS_CYG`],[`EPS_CYG`,`ZET_CYG`]],summaryJa:`天の川の中を南へ向かって悠々と羽ばたく大きな十字架「北十字」の星座。`,mythJa:`大神ゼウスが美しい白鳥に姿を変え、空を舞う姿を描いています。`,tipJa:`デネブを尾、アルビレオを頭として大きな十字架を辿ると、天の川の濃い流れと重なって見えます。`},{id:`Aql`,nameJa:`わし座`,readingJa:`わしざ`,nameLatin:`Aquila`,season:`夏`,ra:19.65,dec:6.5,mainStarId:`ALP_AQL`,lines:[[`GAM_AQL`,`ALP_AQL`],[`ALP_AQL`,`BET_AQL`],[`ZET_AQL`,`DEL_AQL`],[`DEL_AQL`,`ALP_AQL`],[`DEL_AQL`,`LAM_AQL`],[`BET_AQL`,`THE_AQL`]],summaryJa:`七夕のひこ星「アルタイル」が天の川を挟んでおりひめ星（ベガ）と向き合う夏の星座。`,mythJa:`ゼウスの使いとして雷を運び、美少年ガニュメデスを天へ連れ去った巨大な鷲の姿です。`,tipJa:`アルタイルを中心に左右の星が一直線に3つ並ぶ姿（犬飼星）が目印です。`},{id:`Del`,nameJa:`いるか座`,readingJa:`いるかざ`,nameLatin:`Delphinus`,season:`夏`,ra:20.65,dec:14.5,lines:[[`ALP_DEL`,`BET_DEL`],[`BET_DEL`,`DEL_DEL`],[`DEL_DEL`,`GAM_DEL`],[`GAM_DEL`,`ALP_DEL`],[`BET_DEL`,`EPS_DEL`]],summaryJa:`わし座のすぐ東で小さなひし形に星が集まる、可愛らしい夏のミニ星座。`,mythJa:`海へ投げ出された吟遊詩人アリオンを背中に乗せて救った優しいイルカの姿です。`,tipJa:`アルタイルの左斜め上に、4つの星が小さなひし形（菱星）を作って並んでいます。`},{id:`Sco`,nameJa:`さそり座`,readingJa:`さそりざ`,nameLatin:`Scorpius`,season:`夏`,ra:16.85,dec:-30,mainStarId:`ALP_SCO`,lines:[[`BET_SCO`,`DEL_SCO`],[`DEL_SCO`,`PI_SCO`],[`DEL_SCO`,`SIG_SCO`],[`S `]],summaryJa:`秋の夜空のど真ん中に堂々と広がる「秋の四辺形」を胴体とする天馬の星座。`,mythJa:`メドゥーサの血から生まれた翼を持つ白馬ペガスス。夜空では逆さまに駆け抜けています。`,tipJa:`1等星が少ない秋の夜空では、まず天頂付近に大きな正方形「秋の四辺形」を見つけるのが基本です。`},{id:`And`,nameJa:`アンドロメダ座`,readingJa:`あんどろめだざ`,nameLatin:`Andromeda`,season:`秋`,ra:1,dec:35.5,mainStarId:`ALP_AND`,lines:[[`ALP_AND`,`DEL_AND`],[`DEL_AND`,`BET_AND`],[`BET_AND`,`GAM_AND`],[`BET_AND`,`MU_AND`]],summaryJa:`秋の四辺形から東へ伸びる2等星列と、肉眼で見える最遠の天体「アンドロメダ銀河（M31）」で有名。`,mythJa:`海の怪物の生贄にされたエチオピアの王女アンドロメダ。英雄ペルセウスによって救出されました。`,tipJa:`ミラク（β星）から北西へμ星をたどり、同じ距離だけ伸ばすとアンドロメダ銀河が見つかります。`},{id:`Per`,nameJa:`ペルセウス座`,readingJa:`ぺるせうすざ`,nameLatin:`Perseus`,season:`秋`,ra:3.45,dec:45,mainStarId:`ALP_PER`,lines:[[`ETA_PER`,`GAM_PER`],[`GAM_PER`,`ALP_PER`],[`ALP_PER`,`DEL_PER`],[`DEL_PER`,`EPS_PER`],[`EPS_PER`,`ZET_PER`],[`ALP_PER`,`BET_PER`]],summaryJa:`天の川の中に「人」の字型に連なり、変光星アルゴルや8月のペルセウス座流星群で知られる星座。`,mythJa:`メドゥーサを退治し、アンドロメダ姫を救ったギリシャ神話の英雄ペルセウスです。`,tipJa:`カシオペヤ座のすぐ東側にあり、暗い空では二つの星団が並ぶ「二重星団」も肉眼で見えます。`},{id:`PsA`,nameJa:`みなみのうお座`,readingJa:`みなみのうおざ`,nameLatin:`Piscis Austrinus`,season:`秋`,ra:22.4,dec:-30.5,mainStarId:`ALP_PSA`,lines:[[`ALP_PSA`,`EPS_PSA`],[`ALP_PSA`,`DEL_PSA`],[`DEL_PSA`,`BET_PSA`],[`BET_PSA`,`IOT_PSA`],[`IOT_PSA`,`EPS_PSA`]],summaryJa:`秋の夜空でただ一つの1等星フォーマルハウトが南の低空に孤高に輝く星座。`,mythJa:`みずがめ座が注ぐ水を口いっぱいに飲み干している大きな魚とされます。`,tipJa:`フォーマルハウトがとにかく目立つので、まずこの1等星を見つければ星座の位置がすぐわかります。`},{id:`Aqr`,nameJa:`みずがめ座`,readingJa:`みずがめざ`,nameLatin:`Aquarius`,season:`秋`,ra:22.3,dec:-7.5,mainStarId:`BET_AQR`,lines:[[`BET_AQR`,`ALP_AQR`],[`ALP_AQR`,`GAM_AQR`],[`GAM_AQR`,`ETA_AQR`],[`ALP_AQR`,`LAM_AQR`],[`LAM_AQR`,`DEL_AQR`]],summaryJa:`秋の南の空に広がる黄道十二星座。3等星が中心で、暗い空ほど美しい水瓶と水の流れが浮かびます。`,mythJa:`神々の宴でお酌を務める美少年ガニュメデスが水瓶を傾ける姿です。`,tipJa:`ペガスス座の鼻先（エニフ）の南側に広がります。`},{id:`Cap`,nameJa:`やぎ座`,readingJa:`やぎざ`,nameLatin:`Capricornus`,season:`秋`,ra:21,dec:-18.5,mainStarId:`DEL_CAP`,lines:[[`ALP2_CAP`,`BET_CAP`],[`BET_CAP`,`OME_CAP`],[`OME_CAP`,`ZET_CAP`],[`ZET_CAP`,`GAM_CAP`],[`GAM_CAP`,`DEL_CAP`],[`DEL_CAP`,`BET_CAP`]],summaryJa:`逆三角形（ビキニ・または船の形）を描く黄道十二星座。`,mythJa:`怪物から逃げるため川に飛び込んだ牧神パンが、慌てて下半身だけ魚になった姿とされます。`,tipJa:`夏の大三角のアルタイルを南へたどった低い空に、大きな逆三角形が見えます。`},{id:`Ari`,nameJa:`おひつじ座`,readingJa:`おひつじざ`,nameLatin:`Aries`,season:`秋`,ra:2.2,dec:22,mainStarId:`ALP_ARI`,lines:[[`41_ARI`,`ALP_ARI`],[`ALP_ARI`,`BET_ARI`],[`BET_ARI`,`GAM_ARI`]],summaryJa:`2等星ハマルと3等星シェラタンがくの字に並ぶ、黄道十二星座のトップバッター。`,mythJa:`空を飛んで子どもたちを救った金色の毛皮の雄羊です。`,tipJa:`アンドロメダ座とおうし座（すばる）の間で、寄り添う2つの明るい星を探しましょう。`},{id:`Psc`,nameJa:`うお座`,readingJa:`うおざ`,nameLatin:`Pisces`,season:`秋`,ra:.5,dec:10,lines:[[`GAM_PSC`,`IOT_PSC`],[`IOT_PSC`,`OME_PSC`],[`OME_PSC`,`NU_PSC`],[`NU_PSC`,`ALP_PSC`],[`ALP_PSC`,`ETA_PSC`],[`ETA_PSC`,`TAU_PSC`]],summaryJa:`秋の四辺形の南と東を取り囲むように大きなV字を描く黄道十二星座。春分点があります。`,mythJa:`美の女神アフロディーテと息子エロスが怪物から逃れるため、リボンで結ばれた2匹の魚に変身した姿です。`,tipJa:`星は4等星中心で控えめなので、郊外やキャンプ場など暗い夜空でじっくりたどるのがおすすめです。`},{id:`Cnc`,nameJa:`かに座`,readingJa:`かにざ`,nameLatin:`Cancer`,season:`春`,ra:8.65,dec:18,lines:[[`IOT_CNC`,`GAM_CNC`],[`GAM_CNC`,`DEL_CNC`],[`DEL_CNC`,`BET_CNC`],[`DEL_CNC`,`ALP_CNC`]],summaryJa:`ふたご座としし座の間にある控えめな星座。甲羅の中央に肉眼でも見えるプレセペ星団（M44）が輝きます。`,mythJa:`英雄ヘルクレスと戦う大蛇ヒドラを助けようとして踏みつぶされた化けガニです。`,tipJa:`暗い空では、星座の中央に淡い雲のように輝くプレセペ星団（M44）が最高の目印になります。`},{id:`Lib`,nameJa:`てんびん座`,readingJa:`てんびんざ`,nameLatin:`Libra`,season:`夏`,ra:15.2,dec:-16,lines:[[`ALP2_LIB`,`BET_LIB`],[`BET_LIB`,`GAM_LIB`],[`GAM_LIB`,`ALP2_LIB`],[`ALP2_LIB`,`SIG_LIB`]],summaryJa:`おとめ座とさそり座の間に四角形を描く黄道十二星座。`,mythJa:`正義の女神アストライアが持つ善悪を測る天秤。古代にはさそりのハサミの一部とされていました。`,tipJa:`スピカとアンタレスのちょうど中間あたりを探しましょう。`},{id:`Dra`,nameJa:`りゅう座`,readingJa:`りゅうざ`,nameLatin:`Draco`,season:`周極`,ra:16.5,dec:62,mainStarId:`GAM_DRA`,lines:[[`GAM_DRA`,`BET_DRA`],[`BET_DRA`,`NU_DRA`],[`NU_DRA`,`XI_DRA`],[`XI_DRA`,`GAM_DRA`],[`XI_DRA`,`DEL_DRA`],[`DEL_DRA`,`ZET_DRA`],[`ZET_DRA`,`ETA_DRA`],[`ETA_DRA`,`IOT_DRA`],[`IOT_DRA`,`ALP_DRA`],[`ALP_DRA`,`KAP_DRA`],[`KAP_DRA`,`LAM_DRA`]],summaryJa:`おおぐま座とこぐま座の間をうねりながら北極を取り巻く長大な周極星座。`,mythJa:`黄金のリンゴの園を守っていた百の頭を持つ竜ラドンです。`,tipJa:`こと座のベガの北側に、竜の頭を表す4つの星の台形がよく目立ちます。`},{id:`Cep`,nameJa:`ケフェウス座`,readingJa:`けふぇうすざ`,nameLatin:`Cepheus`,season:`秋`,ra:22.1,dec:67,mainStarId:`ALP_CEP`,lines:[[`ALP_CEP`,`BET_CEP`],[`BET_CEP`,`GAM_CEP`],[`GAM_CEP`,`IOT_CEP`],[`IOT_CEP`,`ZET_CEP`],[`ZET_CEP`,`ALP_CEP`],[`BET_CEP`,`IOT_CEP`]],summaryJa:`カシオペヤ座の西隣に将棋の駒（家の形）を描く王様の星座。`,mythJa:`カシオペヤ王妃の夫であり、アンドロメダ姫の父であるエチオピア王ケフェウスです。`,tipJa:`北極星とカシオペヤ座・はくちょう座の間で五角形の家の形を探します。`},{id:`Cet`,nameJa:`くじら座`,readingJa:`くじらざ`,nameLatin:`Cetus`,season:`秋`,ra:1.8,dec:-8,mainStarId:`BET_CET`,lines:[[`ALP_CET`,`GAM_CET`],[`GAM_CET`,`OMI_CET`],[`OMI_CET`,`ZET_CET`],[`ZET_CET`,`ETA_CET`],[`ETA_CET`,`BET_CET`],[`BET_CET`,`TAU_CET`],[`TAU_CET`,`ZET_CET`]],summaryJa:`秋の南の空に大きく広がる星座。有名な変光星ミラを含みます。`,mythJa:`アンドロメダ姫を襲おうとした海の怪物（ティアマト／ケートス）の姿です。`,tipJa:`尻尾の2等星デネブ・カイトスと頭のメンカルを起点に探しましょう。`},{id:`Hya`,nameJa:`うみへび座`,readingJa:`うみへびざ`,nameLatin:`Hydra`,season:`春`,ra:10.5,dec:-12,mainStarId:`ALP_HYA`,lines:[[`DEL_HYA`,`EPS_HYA`],[`EPS_HYA`,`ZET_HYA`],[`ZET_HYA`,`ALP_HYA`],[`ALP_HYA`,`NU_HYA`],[`NU_HYA`,`GAM_HYA`]],summaryJa:`全天88星座の中で最大の面積と長さを誇る春の南の星座。`,mythJa:`切っても首が再生する9つの頭を持つ怪物ヒドラ。`,tipJa:`しし座のレグルスの南西にポツンと赤く輝く2等星アルファルドが目印です。`},{id:`Car`,nameJa:`りゅうこつ座`,readingJa:`りゅうこつざ`,nameLatin:`Carina`,season:`南天`,ra:7.8,dec:-60,mainStarId:`ALP_CAR`,lines:[[`ALP_CAR`,`EPS_CAR`],[`EPS_CAR`,`IOT_CAR`],[`IOT_CAR`,`BET_CAR`]],summaryJa:`全天2位の明るさを誇るカノープスを擁する南天の巨大星座（アルゴ船の竜骨）。`,mythJa:`英雄イアソンと仲間たちが黄金の羊毛を求めて航海した伝説のアルゴ船の一部です。`,tipJa:`本州では南の水平線が開けた冬の夜にカノープスだけが見えることがあります。石垣島や南半球では高く昇ります。`},{id:`Cru`,nameJa:`みなみじゅうじ座`,readingJa:`みなみじゅうじざ`,nameLatin:`Crux`,season:`南天`,ra:12.5,dec:-60,mainStarId:`ALP_CRU`,lines:[[`ALP_CRU`,`GAM_CRU`],[`BET_CRU`,`DEL_CRU`]],summaryJa:`全天で最も小さく、かつ最も有名な南天のシンボル「サザンクロス」。`,mythJa:`大航海時代の船乗りたちが南の極を知る道標とした十字架です。`,tipJa:`場所を「石垣島」や「テカポ湖」に切り替えて春の夜を表示すると美しい十字が見えます。`}],ye=[{id:`winter_triangle`,nameJa:`冬の大三角`,season:`冬`,ra:6.75,dec:-1.5,descriptionJa:`オリオン座のベテルギウス、おおいぬ座のシリウス、こいぬ座のプロキオンを結ぶ美しい正三角形。`,tipJa:`3つとも非常に明るい1等星（シリウスは-1.5等）のため、都会の夜空でも簡単に確認できます。`,lines:[[`ALP_ORI`,`ALP_CMA`],[`ALP_CMA`,`ALP_CMI`],[`ALP_CMI`,`ALP_ORI`]]},{id:`winter_diamond`,nameJ
